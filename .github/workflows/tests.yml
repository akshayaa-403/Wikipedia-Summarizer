name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Serve docs/ and drive the real page: four summaries, live ROUGE, every
      # chart. The suite fetches from the Wikipedia API, so it exercises the
      # same path a visitor does rather than a mocked one.
      - name: Serve the site
        run: python3 -m http.server 8765 --directory docs &

      - name: Wait for the server
        run: |
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8765 >/dev/null && exit 0
            sleep 1
          done
          echo "server never came up" >&2; exit 1

      - run: node tests/e2e/browser_check.mjs
