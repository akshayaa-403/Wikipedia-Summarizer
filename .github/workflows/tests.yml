name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The test suite exercises chunking, ROUGE and the lead/body split. It
      # deliberately does not load BART -- a 1.6 GB download per CI run to test
      # code that is thin glue over model.generate() is not worth the minutes.
      - run: pip install pytest rouge-score nltk requests
      - run: python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"
      - run: pytest tests/ -q
