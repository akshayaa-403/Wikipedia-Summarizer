<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikipedia Summarizer — four algorithms, one article, scored live</title>
<meta name="description" content="Four extractive summarizers run in your browser on any Wikipedia article, scored with ROUGE against the article's own summary.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Wikipedia Summarizer">
<meta property="og:description" content="Four summarization algorithms, run live on any Wikipedia article and scored against the human-written lead.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;650&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>§</text></svg>">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="#top">Wikipedia&nbsp;Summarizer</a>
    <a class="nav-link" href="#summaries-section">Summaries</a>
    <a class="nav-link" href="#metrics">Metrics</a>
    <a class="nav-link" href="https://github.com/akshayaa-403/Wikipedia-Summarizer">Code&nbsp;↗</a>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle colour theme">◐</button>
  </div>
</nav>

<main id="top">

<header class="hero">
  <div class="wrap">
    <h1>Four algorithms summarize<br>the same article.</h1>

    <form class="demo-row" id="demo-form" role="search">
      <label class="sr-only" for="q">Wikipedia article title</label>
      <input id="q" name="q" type="text" placeholder="Any Wikipedia article…"
             autocomplete="off" spellcheck="false" value="Penguin">
      <button class="btn" id="run" type="submit">Summarize</button>
    </form>
    <p class="suggests" id="suggests"></p>
    <div id="status"></div>
  </div>
</header>

<section id="summaries-section">
  <div class="wrap">
    <div id="article-head"></div>
    <div class="cards" id="summaries"></div>
  </div>
</section>

<section id="metrics">
  <div class="wrap">
    <h2 class="section-title">Metrics</h2>

    <div class="chart-grid">

      <figure class="figure wide">
        <p class="fig-num">Chart 1</p>
        <figcaption class="fig-head">
          <span class="fig-title">ROUGE F-measure against Wikipedia's summary</span>
        </figcaption>
        <p class="fig-desc">
          Three metrics, four methods. The dashed rule is Wikipedia's own opening
          trimmed to the same word budget — what a human reaches writing to this brief.
        </p>
        <div class="legend" id="rouge-legend"></div>
        <div class="chart-scroll" id="rouge-chart"></div>
      </figure>

      <figure class="figure">
        <p class="fig-num">Chart 2</p>
        <figcaption class="fig-head">
          <span class="fig-title">Rank stability across metrics</span>
        </figcaption>
        <p class="fig-desc">
          Plotted by rank, not score: values cluster within a thousandth, so ordering
          is the readable question. Crossing lines mean a metric-dependent win.
        </p>
        <div class="chart-scroll" id="slope-chart"></div>
      </figure>

      <figure class="figure">
        <p class="fig-num">Chart 3</p>
        <figcaption class="fig-head">
          <span class="fig-title">Coverage against self-repetition</span>
        </figcaption>
        <p class="fig-desc">
          Right is broader coverage of the article's key terms; down is less repetition
          between the summary's own sentences. MMR is built to reach the lower right.
        </p>
        <div class="chart-scroll" id="quadrant-chart"></div>
      </figure>

      <figure class="figure">
        <p class="fig-num">Chart 4</p>
        <figcaption class="fig-head">
          <span class="fig-title">Sentence overlap between methods</span>
        </figcaption>
        <p class="fig-desc">
          Jaccard similarity of the sentence sets each pair selected. 1.00 means
          identical choices; a dark row means a method is contributing nothing new.
        </p>
        <div class="chart-scroll" id="overlap-chart"></div>
      </figure>

      <figure class="figure">
        <p class="fig-num">Chart 5</p>
        <figcaption class="fig-head">
          <span class="fig-title">Key terms captured</span>
        </figcaption>
        <p class="fig-desc">
          How many of the article's top-20 TF-IDF terms each summary contains — a
          content signal independent of ROUGE, which only ever compares to the lead.
        </p>
        <div class="chart-scroll" id="terms-chart"></div>
      </figure>

      <figure class="figure wide">
        <p class="fig-num">Chart 6</p>
        <figcaption class="fig-head">
          <span class="fig-title">Where each method looks in the article</span>
        </figcaption>
        <p class="fig-desc">
          Kernel density of each method's selected sentences by position. A curve
          humped at the left is lead-biased; ticks on the baseline mark the actual
          sentences chosen.
        </p>
        <div class="chart-scroll" id="density-chart"></div>
      </figure>

    </div>

    <div class="table-scroll">
      <table id="results-table"></table>
    </div>

  </div>
</section>

</main>

<footer>
  <div class="wrap">
    <span>TextRank · LSA · Luhn · MMR — computed in your browser.</span>
    <span>Article text from Wikipedia, CC BY-SA 4.0.</span>
  </div>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
