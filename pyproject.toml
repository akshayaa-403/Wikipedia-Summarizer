[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikisum"
version = "1.0.0"
description = "Summarize long Wikipedia articles with chunked map-reduce BART, evaluated with ROUGE"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31",
    "sumy>=0.11",
    "nltk>=3.8",
    "transformers>=4.40",
    "torch>=2.0",
    "rouge-score>=0.1.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
wikisum = "wikisum.cli:main"

[tool.setuptools]
packages = ["wikisum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
